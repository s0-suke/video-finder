<link rel="stylesheet" href="css/player.css?v=49a8da2d">

</head>
<body>

<div class="banner hidden" id="install-tip"></div>
<div class="banner hidden" id="banner"></div>

<!-- ホーム（動画の一覧。新着がはじめの表示。チップ・絞り込み・検索で自分の興味のある動画だけにする） -->
<div id="view-home" class="hidden">
  <header class="top">
    <div class="bar top-search">
      <div class="search">
        <input id="q" type="search" placeholder="動画を検索（タイトル・品番・タグ）" aria-label="動画を検索" enterkeyhint="search" autocomplete="off">
        <button class="clear" id="q-clear" aria-label="クリア">×</button>
      </div>
      <button class="icon-btn cols-toggle" data-cols-toggle type="button" aria-label="表示の列数を切り替え（1 列 / 2 列）"><svg class="ic-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg><svg class="ic-two" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button class="icon-btn" id="filter-btn" aria-label="絞り込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="dot"></span>
      </button>
    </div>
    <div class="chips" id="home-chips"></div>
    <div class="progress" id="progress"></div>
  </header>
  <div class="meta-line" id="home-meta"></div>
  <div class="ptr" id="ptr">引っ張って新着を確認</div>
  <div class="grid" id="home-grid"><div class="card skel"><div class="thumb"></div><div class="title">&nbsp;</div><div class="sub">&nbsp;</div></div><div class="card skel"><div class="thumb"></div><div class="title">&nbsp;</div><div class="sub">&nbsp;</div></div><div class="card skel"><div class="thumb"></div><div class="title">&nbsp;</div><div class="sub">&nbsp;</div></div><div class="card skel"><div class="thumb"></div><div class="title">&nbsp;</div><div class="sub">&nbsp;</div></div></div>
  <div class="state" id="home-state"></div>
  <div id="home-sentinel" style="height:1px"></div>
</div>

<!-- 出演者（正方形の写真を 2 列。検索・体型タグ・年代・お気に入りで絞る） -->
<div id="view-actors" class="hidden">
  <header class="top">
    <div class="bar top-search">
      <div class="search">
        <input id="aq" type="search" placeholder="出演者を検索（名前・特徴・身長・年齢）" aria-label="出演者を検索" enterkeyhint="search" autocomplete="off">
        <button class="clear" id="aq-clear" aria-label="クリア">×</button>
      </div>
    </div>
    <div class="chips" id="actors-chips"></div>
  </header>
  <div class="meta-line" id="actors-meta"></div>
  <div class="state hidden" id="actors-note"></div>
  <div id="actors-list"></div>
</div>

<!-- 履歴（見た動画を、日付ごとに新しい順。検索はこの中だけ） -->
<div id="view-history" class="hidden">
  <header class="top">
    <div class="bar top-search">
      <div class="search">
        <input id="hq" type="search" placeholder="見た動画を検索" aria-label="履歴を検索" enterkeyhint="search" autocomplete="off">
        <button class="clear" id="hq-clear" aria-label="クリア">×</button>
      </div>
      <button class="icon-btn cols-toggle" data-cols-toggle type="button" aria-label="表示の列数を切り替え（1 列 / 2 列）"><svg class="ic-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg><svg class="ic-two" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    </div>
  </header>
  <div class="meta-line" id="history-meta"></div>
  <div class="grid" id="history-grid"></div>
  <div class="state" id="history-state"></div>
  <div id="history-sentinel" style="height:1px"></div>
</div>

<!-- お気に入り（動画 / 出演者。検索はいま見ている切り替えの中だけ） -->
<div id="view-favs" class="hidden">
  <header class="top">
    <div class="bar top-search">
      <div class="search">
        <input id="fq" type="search" placeholder="お気に入りの動画を検索" aria-label="お気に入りを検索" enterkeyhint="search" autocomplete="off">
        <button class="clear" id="fq-clear" aria-label="クリア">×</button>
      </div>
      <button class="icon-btn cols-toggle" data-cols-toggle type="button" aria-label="表示の列数を切り替え（1 列 / 2 列）"><svg class="ic-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="13" width="16" height="7" rx="1.5"/></svg><svg class="ic-two" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    </div>
    <div class="seg" id="favs-seg" role="tablist" aria-label="お気に入り"><button data-seg="videos" role="tab">動画</button><button data-seg="actors" role="tab">出演者</button></div>
  </header>
  <div class="meta-line" id="favs-meta"></div>
  <div id="favs-videos">
    <div class="grid" id="favs-grid"></div>
    <div class="state" id="favs-state"></div>
    <div id="favs-sentinel" style="height:1px"></div>
  </div>
  <div id="favs-actors" class="hidden"><div id="favs-actors-list"></div></div>
</div>

<!-- 出演者の詳細（開いた元のタブの中として扱う） -->
<div id="view-actor" class="hidden">
  <header class="top"><div class="list-nav"><button class="back-btn" id="actor-back" type="button" aria-label="戻る">‹ 戻る</button></div></header>
  <div class="page" id="view-actor-body"></div>
</div>

<!-- 設定 -->
<div id="view-settings" class="hidden">
  <header>
    <div class="bar">
      <div style="font-weight:600;font-size:17px">設定</div>
    </div>
  </header>
  <div class="page">
    <div class="section-title">収集対象サイト</div>
    <div id="sites"></div>
    <form class="add" id="add-form">
      <input id="add-url" type="url" placeholder="https://example.com/" required>
      <button class="btn primary" type="submit">追加</button>
    </form>
    <p class="note">WordPress系で、ブラウザからのAPI取得を許可しているサイトに対応しています。追加するとすぐ収集を始めます。</p>

    <div class="section-title">収集</div>
    <div class="site">
      <div class="status" id="collect-status"></div>
      <div class="btn-row">
        <button class="btn primary" id="collect-all">新着を収集</button>
        <button class="btn" id="collect-full">全件を再収集</button>
      </div>
      <div class="field" style="margin:14px 0 0"><label>自動で新着を取りに行く間隔</label>
        <select id="interval">
          <option value="0">自動で取りに行かない</option><option value="15">15分</option><option value="30">30分</option>
          <option value="60">1時間</option><option value="180">3時間</option><option value="720">12時間</option><option value="1440">1日</option>
        </select>
      </div>
      <p class="note">アプリを開いたとき・開いている間に、前回からこの時間が経っていれば新着を取りに行きます（iPhone の仕様上、閉じている間は動きません）。</p>
      <p class="note" style="margin-bottom:0" id="last-run"></p>
    </div>

    <div id="settings-extra"></div>

    <div class="section-title">データ</div>
    <div class="site">
      <div class="status" id="storage"></div>
      <div class="btn-row"><button class="btn danger" id="wipe">収集データを削除</button></div>
      <p class="note" style="margin-bottom:0">データはこの端末のブラウザの中だけに保存されます。</p>
    </div>
  </div>
</div>

<!-- 画面下（片手で届く位置）: タブバー。検索はキーボードと干渉しないよう、各タブの上部のヘッダーに置く -->
<div class="dock" id="dock">
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" aria-label="ホーム"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>ホーム</span><i class="tab-badge" id="new-badge"></i></button>
    <button data-tab="actors" aria-label="出演者"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>出演者</span></button>
    <button data-tab="history" aria-label="履歴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>履歴</span></button>
    <button data-tab="favs" aria-label="お気に入り"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg><span>お気に入り</span></button>
    <button data-tab="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>設定</span></button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>

<script type="module" src="js/main.js?v=084379e7"></script>
</body>
</html>
