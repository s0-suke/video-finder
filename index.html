<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Videos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>Video Finder</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/favorites.css">
<link rel="stylesheet" href="css/details.css">
</head>
<body>

<!-- 一覧 -->
<div id="view-list">
  <header>
    <div class="bar">
      <div class="search">
        <input id="q" type="search" placeholder="タイトル・品番・タグで検索" enterkeyhint="search" autocomplete="off">
        <button class="clear" id="q-clear" aria-label="クリア">×</button>
        <div class="suggest hidden" id="suggest"></div>
      </div>
      <button class="icon-btn" id="filter-btn" aria-label="絞り込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="dot"></span>
      </button>
      <a class="icon-btn" href="#settings" aria-label="設定" style="color:inherit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
    <div class="chips" id="chips"></div>
    <div class="progress" id="progress"></div>
  </header>
  <div class="banner hidden" id="banner"></div>
  <div class="meta-line" id="meta"></div>
  <div class="grid" id="grid"></div>
  <div class="state" id="list-state"></div>
  <div id="sentinel" style="height:1px"></div>
  <button id="to-top" aria-label="先頭へ戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>
</div>

<!-- 設定 -->
<div id="view-settings" class="hidden">
  <header>
    <div class="bar">
      <a class="icon-btn" href="#" aria-label="戻る" style="color:inherit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="font-weight:600;font-size:17px">設定</div>
    </div>
  </header>
  <div class="page">
    <div class="section-title">収集対象サイト</div>
    <div id="sites"></div>
    <form class="add" id="add-form">
      <input id="add-url" type="url" placeholder="https://example.com/" required>
      <button class="btn primary" type="submit">追加</button>
    </form>
    <p class="note">WordPress系で、ブラウザからのAPI取得を許可しているサイトに対応しています。追加するとすぐ収集を始めます。</p>

    <div class="section-title">収集</div>
    <div class="site">
      <div class="status" id="collect-status"></div>
      <div class="btn-row">
        <button class="btn primary" id="collect-all">新着を収集</button>
        <button class="btn" id="collect-full">全件を再収集</button>
      </div>
      <div class="field" style="margin:14px 0 0"><label>自動で新着を取りに行く間隔</label>
        <select id="interval">
          <option value="0">自動で取りに行かない</option><option value="15">15分</option><option value="30">30分</option>
          <option value="60">1時間</option><option value="180">3時間</option><option value="720">12時間</option><option value="1440">1日</option>
        </select>
      </div>
      <p class="note">アプリを開いたとき・開いている間に、前回からこの時間が経っていれば新着を取りに行きます（iPhone の仕様上、閉じている間は動きません）。</p>
      <p class="note" style="margin-bottom:0" id="last-run"></p>
    </div>

    <div id="settings-extra"></div>

    <div class="section-title">データ</div>
    <div class="site">
      <div class="status" id="storage"></div>
      <div class="btn-row"><button class="btn danger" id="wipe">収集データを削除</button></div>
      <p class="note" style="margin-bottom:0">データはこの端末のブラウザの中だけに保存されます。</p>
    </div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
